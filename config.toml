####################################################################
# radar config
#
# Tune this file, then re-run `radar rank` (cheap, no network) to see
# the ordering change. Nothing here is sacred -- the defaults are a
# starting point for an independent developer shipping AI products.
####################################################################

[profile]
# Free text about you. Not read by anything at the moment: it fed the
# project briefs, which were removed. Kept for reference.
description = """
Senior software engineer becoming an independent developer: building and
shipping AI products alone, without a company behind them. Wants to see what
other solo builders and small teams are shipping with AI -- coding agents, MCP
servers, voice and vision apps, local-first and self-hosted tools, browser and
desktop apps -- and which of them people actually adopt.

AI is both the subject (agents, models, inference) and the tool (Claude Code
and friends doing most of the typing). Systems work still matters where it
makes an AI product possible, but it is no longer the point.
"""

[interests]
# Weighted keywords. Higher = pulls harder. Matched as whole words (plurals
# and hyphens allowed, so "agent" finds "agents" but not "reagent") against
# title, description, topics, language and the first chunk of the README.
# AI products: what solo builders ship.
"ai" = 0.6
"agent" = 1.0
"agentic" = 0.9
"coding agent" = 1.0
"claude code" = 0.9
"mcp" = 0.9
"llm" = 0.8
"computer use" = 0.8
"browser automation" = 0.7
"ai assistant" = 0.7
"voice" = 0.7
"text to speech" = 0.6
"speech to text" = 0.6
"multimodal" = 0.6
"image generation" = 0.5
"video generation" = 0.5
"rag" = 0.6
"workflow" = 0.5
"automation" = 0.6
# AI security and safety: attacks on models and agents, and the defences.
"ai security" = 0.9
"llm security" = 0.9
"agent security" = 0.9
"prompt injection" = 0.9
"jailbreak" = 0.7
"red teaming" = 0.8
"guardrail" = 0.8
"ai safety" = 0.8
"alignment" = 0.5
"interpretability" = 0.7
"sandbox" = 0.5
"security" = 0.4
# How they ship it.
"indie" = 0.8
"open source alternative" = 0.8
"self hosted" = 0.7
"local first" = 0.7
"on device" = 0.6
"desktop app" = 0.6
"browser extension" = 0.6
"saas" = 0.5
"productivity" = 0.4
# Systems work, where it makes an AI product possible.
"inference" = 0.6
"local llm" = 0.6
"quantization" = 0.4
"runtime" = 0.3
"rust" = 0.3

[rank]
freshness_half_life_days = 45
stale_after_days = 120
mega_star_threshold = 40000
# Runs are manual and occasional, so time in the corpus is counted in runs,
# not days: a six-week gap between runs must not empty the feed.
# Fetches within run_gap_hours of each other count as one run (reruns).
run_gap_hours = 6
# Items no run has seen in this many runs drop out of the feed and out of the
# velocity percentiles. Saved items always stay. `radar prune` deletes them.
forget_after_runs = 3
# The seen_before penalty grows with each run that has already shown an item,
# reaching its full weight after this many runs.
seen_before_full_after_runs = 6
# Hugging Face upvotes are a percentile among featured papers, which are
# already a curated set, so a middling paper would look like a top-velocity
# repo. Scaled down; at 1.0 papers took half the shortlist.
paper_velocity_scale = 0.75

[rank.diversify]
# Redundancy control. Scoring ranks items independently, so N implementations of
# the same idea all score well and all reach the top -- which is exactly what
# happened with local LLM inference engines. This re-ranks the shortlist so each
# pick has to add something the ones above it didn't.
#
#   lambda = 1.00  pure score order (off)
#   lambda = 0.80  light touch
#   lambda = 0.65  default: inference 7/15 -> 3/15, costs ~4% mean score
#   lambda = 0.50  saturated; no further effect on this corpus
enabled = true
lambda = 0.65
# How much of the redundancy signal is conceptual vs. textual. Text similarity
# alone rates two identical-in-spirit inference engines at ~0.1 because they
# share no vocabulary, so the theme taxonomy has to carry most of the weight.
theme_weight = 0.75

[rank.balance]
# Shortlist mix across the infra/application axis (radar/axis.py).
#
# Velocity favours AI infrastructure -- inference engines are what trend -- so
# without a quota the top of the list fills with them even though they are only
# ~12% of the corpus. These are targets, not caps: a bucket that cannot fill
# its share hands the slots to the others rather than shortening the list.
#
# "ai-infra"       building the plumbing: engines, harnesses, routers, training
# "ai-application" AI pointed at a domain: reverse engineering, video, science
# "non-ai"         no AI at all -- databases, compilers, kernels
#
# Tilted toward applications: products built on AI are what an independent
# developer ships, and non-AI work keeps only a small share.
enabled = true
"ai-infra" = 0.30
"ai-application" = 0.55
"non-ai" = 0.15

[rank.weights]
velocity = 1.0
corroboration = 1.4
watchlist = 1.8
fit = 1.6
freshness = 0.7
# Depth rewards systems languages (Rust, C) and topics; most AI products are
# TypeScript or Python, so it is kept low.
depth = 0.4
# A repo under a personal account or a Show HN launch: one person built it.
indie = 0.9

[rank.penalties]
slop = 2.5
chatter = 1.2
stale = 0.6
archived = 1.5
mega = 0.5
seen_before = 0.3
# From Claude Code's signal cards, only on items that have one. Penalty-only:
# a bonus would keep lifting the few items that get carded at all.
low_substance = 2.0
# Light: a simple product that people use is still worth seeing.
shallow = 0.3

####################################################################
# Sources
####################################################################

[sources.github_starred]
enabled = true
within_days = 120
pages_per_user = 1
# THE most important knob in this file. These are the engineers whose taste
# you're borrowing. Replace them with people whose work you actually respect --
# the tool gets dramatically better when this list is personal.
users = [
  # AI and systems engineers whose taste carries over.
  "karpathy",
  "simonw",
  "ggerganov",
  "geohot",
  "mitchellh",
  "antirez",
  # Independent developers shipping AI products.
  "steipete",
  "Nutlope",
  "mckaywrigley",
  "transitive-bullshit",
  "steven-tey",
  "yoheinakajima",
  "jxnl",
  "levelsio",
  "marclou",
  "danielmiessler",
  # Independent developers in the Chinese AI scene.
  "Yidadaa",
  "lencx",
  "zhayujie",
]

[sources.github_search]
enabled = true
# Widening this brings older repos into the corpus, but `freshness` has a
# 45-day half-life, so anything near the edge of the window scores ~0.004 there
# and has to earn its place on velocity, fit and depth instead. That is usually
# the right behaviour: an old repo still gaining stars fast is interesting, an
# old quiet one is not.
created_within_days = 365
min_stars = 120
per_query = 40
# Each query is combined with the created/stars filters above.
queries = [
  # AI products and the pieces they are built from.
  "topic:ai-agents",
  "topic:agent",
  "topic:llm",
  "topic:mcp",
  "topic:mcp-server",
  "topic:claude-code",
  "topic:coding-agent",
  "topic:ai-assistant",
  "topic:generative-ai",
  "topic:rag",
  "topic:browser-automation",
  "topic:computer-use",
  # AI security and safety.
  "topic:ai-security",
  "topic:llm-security",
  "topic:prompt-injection",
  "topic:jailbreak",
  "topic:red-teaming",
  "topic:guardrails",
  "topic:ai-safety",
  "topic:interpretability",
  # Domains where one person can ship a whole product. Single topics work far
  # better than pairs or free text -- GitHub topics are under-applied, so
  # "topic:llm topic:tts" returns nothing while "topic:text-to-speech" returns
  # the real projects and the ranker sorts out which of them use AI.
  "topic:text-to-speech",
  "topic:speech-recognition",
  "topic:computer-vision",
  "topic:image-generation",
  "topic:video-generation",
  "topic:self-hosted",
  "topic:local-first",
  "topic:browser-extension",
  "topic:productivity",
  "topic:automation",
  # Systems work behind AI products.
  "topic:inference",
  "topic:llm language:rust",
]

[sources.github_trending]
enabled = true
windows = ["daily", "weekly"]
# Most AI products are TypeScript or Python.
languages = ["", "typescript", "python", "rust", "go", "swift"]
# The trending page has no star count, creation date or topics, so each repo
# is looked up once through the API (cached). Without it fit, depth,
# freshness and the mega penalty score trending repos on nothing.
hydrate = true
hydrate_workers = 8

[sources.hackernews]
enabled = true
within_days = 21
min_points = 120
# Show HN is where solo builders launch, so it gets a lower bar.
show_hn_min_points = 25
limit = 120

[sources.lobsters]
enabled = true
pages = 3
min_score = 8

[sources.arxiv]
enabled = true
within_days = 21
per_category = 40
# AI, language, software engineering, human-computer interaction, and
# security (where prompt-injection and jailbreak papers land).
categories = ["cs.AI", "cs.CL", "cs.SE", "cs.HC", "cs.CR"]

[sources.github_activity]
# What the watched engineers are building themselves: their own pushes, new
# repos and releases (same users as github_starred). Their stars show taste;
# their work shows what they think is worth doing. Forks are ignored.
enabled = true
within_days = 30
pages_per_user = 1
own_repos_only = true

[sources.hf_papers]
# Hugging Face daily papers. arXiv itself carries no popularity signal, so
# papers could only rank on fit and freshness; these merge onto the same
# paper and bring an upvote count.
enabled = true
days = 7
per_day = 50

[sources.bluesky]
# Posts linking to a repo or paper, via the public search API (no account).
# Off by default: the API refuses some networks outright (HTTP 403,
# "forbidden by administrative rules"). Enable it, run `radar fetch`, and
# keep it if it answers. Queries default to your interest terms.
enabled = false
within_days = 14
min_likes = 5
per_query = 50
domains = ["github.com", "arxiv.org"]
# queries = ["inference engine", "compiler", "database internals"]

####################################################################
# Claude Code
#
# Signal cards and translation call the Claude Code CLI in headless mode
# with your existing Claude login. No API key is used; one set in the
# environment is withheld from Claude Code. Sign in once by running
# `claude` and typing /login; check with `radar doctor`. Runs count against
# your Claude plan's usage limits.
####################################################################

[claude]
# Empty = Claude Code's default model. Aliases like "opus" or "sonnet" work.
model = ""
timeout_seconds = 1200
# Leave unset to find `claude` on PATH, or the copy bundled with the Claude
# desktop app on Windows.
# claude_path = "C:/path/to/claude.exe"

[cards]
# Claude reads the top-ranked items and writes a card for each: what it
# really is, how deep the engineering goes, and whether it is a thin wrapper
# or marketing. Thin and shallow items are pushed down the ranking.
count = 18
per_call = 6
max_workers = 3
# low | medium | high | xhigh | max
effort = "high"
# "en" or "zh-CN" for the card text itself.
language = "en"
# Cards older than this are redone, so a repo that changed gets re-read.
ttl_days = 60
# How much of each README the card pass reads.
readme_chars = 8000

[publish]
# Archived pages younger than this are all kept; older ones are thinned to
# one per week. Each page is about half a megabyte.
archive_keep_days = 30

[gaps]
# `radar run` checks the top papers for existing code (a linked repo on
# Hugging Face, or a GitHub repo citing the arXiv number) so the dashboard
# can list papers nobody has implemented. GitHub search allows 30 requests a
# minute, so this is paced: about 2 seconds per unchecked paper.
enabled = true
check = 25
recheck_days = 14

[track]
# `radar track add "name" --keywords "a,b"` watches a project's space on
# every run: matching items in radar, repos created on GitHub since you
# started, and new arXiv papers. GitHub searches are paced (about 2 seconds
# each, up to 6 per track).
search_github = true
search_arxiv = true

[translate]
# Content in Simplified Chinese: item descriptions, paper and headline titles
# and track hits, translated through Claude Code during `radar run`. Each
# string is translated once and
# stored; later runs only send what is new. English is kept, and the page's
# language toggle switches content too.
enabled = true
effort = "low"
per_call = 80
max_workers = 3

[report]
# Default language of the dashboard and digest: "en" or "zh-CN". The page has
# a toggle either way; this only picks what it shows first.
language = "zh-CN"

# Extra Overview lanes for subjects you follow: the highest-scoring items whose
# name, description or topics match a term. ai_only (default true) keeps out
# items with no AI in them, so "jailbreak" does not mean iPhones.
[[report.topic_lanes]]
key = "ai-security"
en = "AI security & safety"
zh = "AI 安全"
note_en = "prompt injection, jailbreaks, guardrails, agent sandboxing, red teaming, alignment, interpretability"
note_zh = "提示词注入、越狱、护栏、agent 沙箱、红队测试、对齐、可解释性"
# Specific phrases only: bare "security", "safety", "privacy" or "sandbox"
# turn up in ordinary product blurbs and filled this lane with a TV debloater.
terms = ["ai security", "llm security", "agent security", "mcp security",
         "security scanner", "security audit", "security testing", "ai safety",
         "llm safety", "prompt injection", "jailbreak", "red teaming", "red team",
         "guardrail", "adversarial", "alignment", "interpretability",
         "vulnerability", "vulnerabilities", "malicious", "pentest",
         "penetration testing", "threat model"]

[storage]
db = "radar.db"
out_dir = "out"
http_cache_seconds = 1800
