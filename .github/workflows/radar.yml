name: radar

# Tests only. The site is published from your machine with `radar publish`,
# because briefs need a Claude Code login that only exists there.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest -q
