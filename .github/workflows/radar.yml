name: radar

# Reruns the pipeline, publishes the new dashboard to GitHub Pages, and keeps
# every previous run as a dated snapshot under /archive/.
#
# Manual only: trigger it from the Actions tab ("Run workflow") when you want
# a fresh page. There is no schedule. Briefs are generated locally through
# Claude Code (`radar run`), not here -- CI has no Claude login.
on:
  workflow_dispatch:
  # Pushes and pull requests only run the tests; they never publish.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest -q

  run:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Never let two runs publish at once; they would race on the gh-pages branch.
    concurrency:
      group: radar-publish
      cancel-in-progress: false
    steps:
      - name: Check out the tool
        uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*

      - run: pip install -r requirements.lock

      - name: Fetch the published site (carries the corpus forward)
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch --depth 1 \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
            echo "restored existing site"
          else
            mkdir -p site
            echo "no gh-pages yet, starting fresh"
          fi
          mkdir -p site/archive
          # radar.db lives on the branch so the corpus (first_seen, dismissals,
          # the seen_before decay) survives across runs. A cache would be
          # evictable, and losing it silently resets "new this run" to
          # everything.
          if [ -f site/radar.db ]; then
            cp site/radar.db radar.db
            echo "corpus restored: $(du -h radar.db | cut -f1)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run radar
        env:
          # radar reads GITHUB_TOKEN for the GitHub API (5000 req/hr).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Briefs need a Claude Code login, which only exists on your machine.
        run: python -m radar run --no-open --no-llm

      - name: Publish new snapshot and archive the old one
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%d-%H%M)"
          # The page being replaced becomes the archived one, so /archive/
          # holds what was actually served rather than a re-render.
          if [ -f site/index.html ]; then
            cp site/index.html "site/archive/${STAMP}.html"
            echo "archived previous page as ${STAMP}.html"
          fi
          cp out/index.html site/index.html
          cp "$(ls -t out/digest-*.md | head -1)" site/digest.md
          cp radar.db site/radar.db
          # Pages would otherwise run the tree through Jekyll and drop
          # underscore-prefixed paths.
          touch site/.nojekyll
          python scripts/build_archive_index.py site/archive

      - name: Push to gh-pages
        run: |
          set -euo pipefail
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "radar snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          # Single-commit history on purpose. The dashboard and the database
          # are a few MB and rewritten every run; keeping history would add
          # that much per day forever. The archive files in the tree are the
          # history worth keeping.
          git push -f -q \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "published"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### radar published"
            echo ""
            echo "- site: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
            echo "- archive: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/archive/"
            echo "- snapshots kept: $(ls -1 site/archive/*.html 2>/dev/null | grep -vc 'index.html$' || echo 0)"
            echo "- corpus: $(du -h site/radar.db 2>/dev/null | cut -f1 || echo n/a)"
          } >> "$GITHUB_STEP_SUMMARY"
